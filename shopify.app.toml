# Dati Fiscali B2B — app a distribuzione custom, installata sul singolo negozio.
#
# `client_id` viene compilato da `shopify app config link` al primo collegamento
# con l'app creata nel Dev Dashboard: non va inventato a mano.
#
# `application_url` deve rispondere anche se l'app non ha backend: una theme app
# extension non rientra fra le estensioni compatibili con le app "extension-only"
# (confermato da Shopify il 30/07/2026), quindi l'app deve dichiarare un URL.
# Punta a una pagina statica su GitHub Pages: nessun server da mantenere.
# Sorgente: github.com/FrancescoBonizzi/dati-fiscali-b2b-app

name = "Dati Fiscali B2B"
handle = "dati-fiscali-b2b"
application_url = "https://francescobonizzi.github.io/dati-fiscali-b2b-app/"
embedded = false

# Nessuna chiamata all'Admin API: tutto passa dagli endpoint pubblici del carrello.
[access_scopes]
scopes = ""
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://francescobonizzi.github.io/dati-fiscali-b2b-app/" ]

[webhooks]
api_version = "2026-07"

[pos]
embedded = false
